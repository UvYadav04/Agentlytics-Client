# Standalone compose file for the Client (Next.js) repo - deployed independently from Server's
# own docker-compose.yml (see that file's top comment: "Client lives in its own separate repo and
# is deployed independently"). This is that separate deployment.
#
# Usage: docker compose up -d --build
#
# --- Build args vs. runtime environment ---
# NEXT_PUBLIC_API_URL / NEXT_PUBLIC_GOOGLE_CLIENT_ID are compiled INTO the client JS bundle at
# `next build` time (see Dockerfile's `builder` stage) - that's a Next.js constraint for anything
# prefixed NEXT_PUBLIC_*, not a choice made here. They MUST arrive as build `args:` below, not as
# a plain `environment:` block - setting them there would have zero effect on the already-built
# bundle and just silently do nothing.
#
# --- Image tagging (Docker Hub) ---
# Same dual `build:` + `image:` declaration Server/docker-compose.yml uses, for the same three
# workflows:
#   - Local dev:  docker compose up -d --build         (builds + runs straight from source)
#   - CI:         docker compose build && docker compose push
#   - Deploy box: docker compose pull && docker compose up -d   (never touches `build:`, just
#                 pulls whatever CI pushed)
# DOCKERHUB_USERNAME / IMAGE_TAG come from a `.env` file next to this compose file (see
# .env.example) - docker compose auto-loads it for ${VAR} substitution.
#
# Usage: docker compose up -d --build

services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    image: itzdineshyadav/data-analyzer:client
    container_name: data-analyzer-client
    restart: unless-stopped
    ports:
      - "3000:3000"
